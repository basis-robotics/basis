

# The ways handlers are allowed to interact with eachother 
threading_model:
  single
cpp_includes:
  - sensor_msgs/Image.h
  - sensor_msgs/PointCloud2.h
  - test.pb.h
  - basis_example.pb.h
args:
  pub:
    type: bool
handlers:
  InprocTestTrigger:
    sync:
      type: all
      rate: 1
    outputs:
      /test:
        type: raw:std::string
        optional: True
  InprocTest:
    sync:
      type: all
    inputs:
      /test:
        type: raw:std::string
